---
# MCS tracking configuration file for MRMS 3D composite reflectivity
# regridded to the HRRR 3-km grid (feature_type: radar_feature).
#
# Unlike config_mcs_tbpf_*.yml (Tb + precipitation) or the tb_pf_radar3d
# configs (Tb + SL3D), this pipeline identifies and tracks MCS directly from
# 3D (or 2D) Cartesian radar reflectivity alone: no Tb, no PF-linking, no
# SL3D. See pyflextrkr/idfeature_radar3d.py.
#
# Grid/Steiner/vertical-coordinate parameters below follow the existing MRMS
# cell-tracking config (feature_type: radar_cells) for this same input data.

# Processing steps:
run_idfeature : True         # parallel (batched by time frame, see combine_files below)
run_tracksingle : True       # parallel
run_gettracks : True         # serial
run_trackstats : True        # parallel
run_identifymcs : False      # [Phase 3] serial - not yet implemented
run_mapfeature : False       # [Phase 4] parallel - not yet implemented
run_speed : False            # optional, parallel - not yet implemented

# Parallel processing set up
# run_parallel: 0 (serial), 1 (local cluster), 2 (Dask distributed scheduler)
run_parallel: 1
nprocesses : 32  # Number of processors to use if run_parallel=1
dask_tmp_dir: /tmp  # Dask temporary directory if run_parallel=1
timeout: 360  # [seconds] Dask timeout limit

# Batched multi-file time-frame processing (idfeature_driver.py).
# Instead of one dask task per input file, lazily combine all files in the
# time range into one Dataset (xr.open_mfdataset) and dispatch one task per
# TIME FRAME, in batches, waiting for each batch to finish before submitting
# the next one (keeps the task graph/scheduler load bounded for long runs).
combine_files: True
# Explicit batch size override. Leave null to use
# (total worker threads) * dask_batch_multiplier instead.
dask_batch_size: null
dask_batch_multiplier: 64

# Start/end date and time (test period)
startdate: '20250502.0000'
enddate: '20250504.0000'

# Specify tracking input data date/time string format
# E.g., MRMS_Reflectivity_HRRR_20250502-190043.nc --> yyyymodd-hhmmss
time_format: yyyymodd-hhmmss
databasename: MRMS_Reflectivity_HRRR_
input_format: netcdf  # zarr or netcdf

# Input files directory
clouddata_path: /pscratch/sd/i/iclas2/MRMS/remap_hrrr/
# Working directory for the tracking data
root_path: /pscratch/sd/i/iclas2/MRMS/mcs_conus/
# Working sub-directory names
tracking_path_name: tracking
stats_path_name: stats
pixel_path_name: mcstracking

# Terrain file: used for the surface elevation (sfc_elev) that sfc_dz_min/max
# are measured relative to, following the cell-tracking config for this same
# grid. Without this, sfc_elev defaults to a flat 0 m everywhere, which gives
# real differences from the terrain-aware reference over elevated terrain
# (confirmed empirically: ~4.9% of column-max reflectivity pixels differ).
terrain_file: /pscratch/sd/w/wcmca1/SCREAMv1-cess2/maps/hrrr_sfc_latlon_orog_lsm.nc
elev_varname: orog

# Specify types of feature being tracked
# This adds additional feature-specific statistics to be computed
feature_type: radar_feature

# -----------------------------------------------------------------------
# Input dataset structure
# -----------------------------------------------------------------------
pixel_radius: 3.0  # [km] Spatial resolution of the input data
area_method: fixed  # 'fixed' (default) or 'latlon' for latitude-dependent grid cell area
datatimeresolution: 0.083333  # [hour] ~5 minutes
reflectivity_varname: Reflectivity
dx: 3000  # [m]
dy: 3000  # [m]
x_dimname: x
y_dimname: y
z_dimname: heightAboveSea
time_dimname: time
x_coordname: lon
y_coordname: lat
z_coordname: heightAboveSea
lon_coordname: lon
lat_coordname: lat
time_coordname: time
radar_sensitivity: 0.0  # [dBZ] minimum reflectivity threshold; below this (or NaN) is floored

# Vertical coordinate settings
# MRMS heightAboveSea coordinate has incorrect units='1' in file; override.
z_coord_type: height
default_sfc_height: 0.0  # [m], used only if terrain_file is not provided
sfc_dz_min: 1000.0    # [m] offset from surface to exclude near-surface contamination
sfc_dz_max: 2500.0    # [m] range above sfc_dz_min used for low-level reflectivity
z_coord_scale_factor: null
sfc_elev_scale_factor: null
z_coord_units_override: 'm'
sfc_elev_units_override: null
# geolimits: [lat_min, lon_min, lat_max, lon_max]  # optional domain subset

# -----------------------------------------------------------------------
# [Phase 1] Feature labeling and growth options
# (used by idfeature_radar3d.py via label_and_grow_features; follows the
# same detect-and-grow approach as idclouds_tbpf, but core_operator='gt'
# since higher reflectivity = more intense, unlike cold Tb)
# -----------------------------------------------------------------------
feature_dbz_threshs: [30, 10]  # [dBZ] [core_thresh, secondary/growth_thresh]
smooth_size: 5       # Box2DKernel smoothing window before core detection
min_core_npix: 4      # Minimum number of pixels for a smoothed core
area_thresh: 36      # [km^2] Minimum area to define a feature (4 pixels @ 3km)
core_operator: gt     # 'gt': field > threshold defines cores (reflectivity)
growth_method: edt    # 'bfs' or 'edt' (Voronoi, faster)
feature_expand_tertiary: 0  # No tertiary expansion (thresholds collapse to 2 levels)
feature_field_floor: null   # Defaults to radar_sensitivity if not set
miss_thresh: null     # Optional: skip frames with column-max NaN fraction above this

# -----------------------------------------------------------------------
# [Phase 1] Steiner convective/stratiform classification
# Follows the cell-tracking identification config parameters
# (config_celltracking_3km_MRMS_202505.yaml) verbatim.
# -----------------------------------------------------------------------
absConvThres: 60
minZdiff: 10
truncZconvThres: 55
mindBZuse: 25
dBZforMaxConvRadius: 60
conv_rad_start: 3.0
maxConvRadius: 5.0
conv_rad_increment: 0.5
bkg_refl_increment: 5
bkgrndRadius: 13.5
min_corearea: 9.0
min_cellarea: 81.0
remove_smallcores: True
remove_smallcells: True
weakEchoThres: 15
convolve_method: ndimage
dilate_method: orig
return_diag: False
echotop_gap: 1
echotop_method: fast
# cell_number: labeled, size-sorted convective cell ID derived from the
# Steiner diagnostic mask (see plan Design decision 1).
cell_number_source: score_orig  # 'score_orig' (pre small-core filter) or 'score_dilate'
cell_min_npix: 0

# -----------------------------------------------------------------------
# Tracking parameters
# -----------------------------------------------------------------------
othresh: 0.3  # overlap fraction threshold
timegap: 0.25  # [hour] If missing data duration longer than this, tracking restarts
nmaxlinks: 50  # Maximum number of clouds that any single cloud can be linked to
maxnclouds: 3000  # Maximum number of clouds in one snapshot
auto_update_maxnclouds: True
duration_range: [2, 400]  # [minlength, maxlength] in time steps
duration_range_auto_update: True
duration_range_round_base: 10
remove_shorttracks: 1
trackstats_dense_netcdf: 1
match_pixel_dt_thresh: 60.0  # [seconds]

# Define tracked feature variable names
feature_varname: feature_number
nfeature_varname: nfeatures
featuresize_varname: npix_feature

# Track statistics output file dimension names
tracks_dimname: tracks
times_dimname: times
fillval: -9999

# File base names
mcstbstats_filebase: mcs_tracks_
mcspfstats_filebase: mcs_tracks_pf_
mcsrobust_filebase: mcs_tracks_robust_
pixeltracking_filebase: mcstrack_

# -----------------------------------------------------------------------
# [Phase 2] trackstats_func.py radar_feature branch
# -----------------------------------------------------------------------
trackstats_dbz_area_threshs: [45, 50]  # [dBZ] area_<T>dbz / conv_area_<T>dbz thresholds
ref_varname: dbz_comp

# -----------------------------------------------------------------------
# [Phase 3] identifymcs_radar.py - radar-based MCS definition and lifecycle
# -----------------------------------------------------------------------
mcs_majoraxis_thresh: 100  # [km] MCS feature major axis length lower limit
mcs_dbz45_area_varname: area_45dbz  # whole-feature reflectivity-threshold area
mcs_dbz45_area_thresh: 0  # [km^2] must be > this (i.e. > 0 pixels)
mcs_duration_thresh: 4  # [hour] Minimum duration of MCS criteria being met
mcs_gap_hour: 0.25  # [hour] Allowable gap bridging MCS criteria time groups
mcs_merge_duration: 1.0  # [hour] Short tracks <= this merging into another track are fragments
mcs_split_duration: 1.0  # [hour] Short tracks <= this splitting from another track are fragments
mcs_lifecycle_thresh: 8  # [hour] Minimum MCS duration to evaluate lifecycle stages
mcs_lifecycle_line_thresh: 100  # [km] Convective line major axis threshold for organized convection
mcs_lifecycle_gap_hour: 1.0  # [hour] Gap bridging separate convective line episodes
mcs_lifecycle_genesis_lag_hour: 1.0  # [hour] Lag after line organizes before genesis starts
mcs_lifecycle_mature_lag_hour: 2.0  # [hour] Lag after genesis before mature stage starts
mcs_lifecycle_sf_area_min: 0  # [km^2] Minimum stratiform area floor for the mature-stage test
finalstats_filebase: trackstats_final_
finalstats_min_area: 0  # [km^2] Optional safety-valve filter; 0 = keep all tracks (default)
finalstats_min_duration: null  # [hour] Optional safety-valve filter; null = keep all tracks

# -----------------------------------------------------------------------
# [Phase 4] mapfeature_func.py radar_feature branch
# -----------------------------------------------------------------------
dbz_thresh: 10  # [dBZ] threshold for the dbztracknumber pixel map
mapfeature_class_varname: feature_class

# Feature movement speed parameters (optional, run_speed)
lag_for_speed: 1
track_number_for_speed: dbztracknumber
track_field_for_speed: dbz_comp
min_size_thresh_for_speed: 20
max_speed_thresh: 50
max_speed_for_trajectory_smoothing: 40
mcsfinal_filebase: mcs_tracks_final_
